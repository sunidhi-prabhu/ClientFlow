name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: clientflow
          POSTGRES_DB: clientflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clientflow -d clientflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://clientflow:clientflow@localhost:5432/clientflow
      # Created and migrated by the integration test global setup.
      TEST_DATABASE_URL: postgresql://clientflow:clientflow@localhost:5432/clientflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck, lint, format, unit tests
        run: npm run check

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Migrations match schema
        # The integration setup applied every migration to the test database;
        # any difference from schema.prisma means a migration is missing.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Build
        run: npm run build
