# Local development database. Not used in production.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: clientflow
      POSTGRES_DB: clientflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientflow -d clientflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
